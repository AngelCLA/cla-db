name: CLA DB CI
on:
  push:
    branches: [master, 'feature/**', 'chore/release-0.1.3']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Node 20 remains in engines; current supported LTS lines are represented here.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      # CLA-DB: npm 10's peer resolution rejects the lock generated with npm 11.
      - name: Install pinned npm for the lockfile
        run: |
          npm install --prefix "$RUNNER_TEMP/cla-ci-npm" --ignore-scripts --no-audit --no-fund --no-save --package-lock=false npm@11.19.1
          test "$("$RUNNER_TEMP/cla-ci-npm/node_modules/.bin/npm" --version)" = 11.19.1
          printf "%s\n" "$RUNNER_TEMP/cla-ci-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/release-supply-chain-fixtures/workflow-policy.mjs
      - run: npm run lint
      - run: npm run build
      - run: npm run check-types
      - run: npm run test:typings
      - run: npm run test:circular
      - run: npm run test:fast:memory
      - run: npm run test:fast:dexie
      - run: node ./scripts/verify-pack-consumer.mjs
      - name: Audit actual production artifact and dependency licenses
        run: |
          pack_dir=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$pack_dir"
          tgz="$pack_dir/clatech-db-$(node -p "require('./package.json').version").tgz"
          node scripts/check-release-supply-chain.mjs --artifact "$tgz"
      - name: Development audit (known findings, requires release disposition)
        continue-on-error: true
        run: npm audit --audit-level=moderate
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # The landing check executes the displayed example against built root exports.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build

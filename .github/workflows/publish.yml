name: Manually publish vetted CLA DB
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH @clatech/db@0.1.2'
        required: true
        type: string
      sha256:
        description: 'Expected SHA-256 of independently vetted clatech-db-0.1.2.tgz'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'AngelCLA/cla-db' && github.ref == 'refs/heads/master' &&
      github.ref_protected && inputs.confirmation == 'PUBLISH @clatech/db@0.1.2'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint && npm run build && npm run check-types
      - run: npm run test:typings && npm run test:circular
      - run: npm run test:fast:memory && npm run test:fast:dexie
      - run: node scripts/verify-pack-consumer.mjs
      - name: Bind reviewed bytes to manual input
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          npm pack --ignore-scripts
          printf '%s  clatech-db-0.1.2.tgz\n' "$EXPECTED_SHA256" > expected.sha256
          sha256sum --check expected.sha256
          node scripts/check-release-supply-chain.mjs --artifact ./clatech-db-0.1.2.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: vetted-package
          path: clatech-db-0.1.2.tgz
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: build
    if: >-
      github.repository == 'AngelCLA/cla-db' && github.ref == 'refs/heads/master' &&
      github.ref_protected && inputs.confirmation == 'PUBLISH @clatech/db@0.1.2'
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency installation, build or repository scripts in this job.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: vetted-package
      - name: Verify toolchain, immutable bytes and publish without lifecycle scripts
        env:
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test "$(printf '22.14.0\n%s\n' "$(node -p 'process.versions.node')" | sort -V | head -n1)" = '22.14.0'
          test "$(printf '11.5.1\n%s\n' "$(npm --version)" | sort -V | head -n1)" = '11.5.1'
          printf '%s  clatech-db-0.1.2.tgz\n' "$EXPECTED_SHA256" | sha256sum --check
          tar -xOf clatech-db-0.1.2.tgz package/package.json | node -e '
            let s=""; process.stdin.on("data", c => s+=c).on("end", () => {
              const p=JSON.parse(s); if(p.name!=="@clatech/db" || p.version!=="0.1.2") process.exit(1);
            });'
          npm publish ./clatech-db-0.1.2.tgz --provenance --access public --ignore-scripts
